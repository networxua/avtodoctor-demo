<!DOCTYPE html>
<html class="staticrypt-html" lang="uk">
    <head>
        <meta charset="utf-8" />
        <title>Автодоктор — демо</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex,nofollow" />
        <link rel="icon" href="img/favicon.svg" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #AB3A34;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #AB3A34;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #1d1f21;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* Avtodoktor login */
            html.staticrypt-html,body.staticrypt-body{background:#1d1f21!important;font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;color:#E8E6E0;margin:0;min-height:100vh}
            .staticrypt-page{width:min(380px,calc(100% - 40px))!important;padding:16vh 0 0!important}
            .staticrypt-form{background:#26292c!important;max-width:none!important;padding:36px 30px 30px!important;box-shadow:none!important;border:1px solid #34383c;border-top:3px solid #AB3A34;border-radius:0!important;text-align:left!important}
            .staticrypt-title{font-size:24px!important;font-weight:600;letter-spacing:.01em;color:#fff!important;margin:0 0 8px!important}
            .staticrypt-instructions p{color:#cfccc5;font-size:14px;line-height:1.5;margin:0}
            .staticrypt-hr{border-top-color:#34383c!important}
            .staticrypt-form input[type="password"]{background:#1d1f21!important;border:1px solid #4b4f53!important;color:#fff!important;border-radius:0!important;font-size:16px!important;padding:14px!important}
            .staticrypt-form input[type="password"]:focus{border-color:#C2443D!important;outline:none}
            .staticrypt-form .staticrypt-decrypt-button{border-radius:0!important;font-size:15px!important;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:15px!important}
            .staticrypt-remember{color:#cfccc5!important;font-size:14px!important}
            .staticrypt-remember input{accent-color:#AB3A34}
            .staticrypt-toggle-password-visibility{filter:invert(1);opacity:.5!important}
            .staticrypt-spinner-container{background:#1d1f21}
            .staticrypt-spinner{border-color:#AB3A34!important;border-right-color:transparent!important}
        </style>
    </head>
